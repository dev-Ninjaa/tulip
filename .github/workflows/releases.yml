name: Release Tulip Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create local .env from example
        run: |
          cp .env.example .env
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            sed -i "s/GEMINI_API_KEY=MY_GEMINI_API_KEY/GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}/" .env
          fi

      - name: Run verification tests
        run: ./gradlew testDebugUnitTest

      - name: Check Release Signing Credentials
        id: check_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Signing secrets detected. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release-keystore.jks
            echo "HAS_SIGNING=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_SIGNING=false" >> $GITHUB_OUTPUT
            echo "::warning::No production release keystore secrets configured in GitHub. Building unsigned/debug release for artifact distribution."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.check_signing.outputs.HAS_SIGNING }}" == "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk /tmp/Tulip-${{ github.ref_name }}.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/Tulip-${{ github.ref_name }}-unsigned.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Tulip ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            /tmp/Tulip-${{ github.ref_name }}*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
